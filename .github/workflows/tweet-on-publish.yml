name: Tweet New Article

on:
  push:
    branches:
      - master
    paths:
      - articles.json

jobs:
  tweet:
    runs-on: ubuntu-latest
    # Only run when the commit message starts with "Auto-publish" (cron articles)
    # or "Restore" / "manual" — skips ticker/comic/validator commits
    if: |
      startsWith(github.event.head_commit.message, 'Auto-publish') ||
      startsWith(github.event.head_commit.message, 'Manual publish')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post tweet
        env:
          TWITTER_API_KEY:     ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:  ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python tweet_article.py
